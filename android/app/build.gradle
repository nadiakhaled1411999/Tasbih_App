plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
 android {
    namespace "com.example.tasbih_app"
    compileSdk 36          // أعلى عشان sentry_flutter يرضى (36 مطلوب)
    ndkVersion "27.0.12077973"  // اللي طالباه jni و package_info_plus

    defaultConfig {
        applicationId "com.example.tasbih_app"
        minSdk 23              // رفعناه شوية عشان التوافق (21 كان منخفض جدًا)
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17   // مهم لـ Kotlin 2.x
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        languageVersion = "1.8"
        apiVersion = "1.8"

    }
}

flutter {
    source = "../.."
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        languageVersion = "1.8"
        apiVersion = "1.8"
    }
}