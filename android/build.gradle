// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.0'   // أو 2.0.0 إذا كنتِ تستخدمين إصدار أحدث من Kotlin

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin - إصدار مستقر ومتوافق مع compileSdk 34
        classpath 'com.android.tools.build:gradle:8.9.1'

        // Kotlin Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // لو كنتِ تستخدمين Firebase أو Crashlytics أو غيرهم، ممكن تضيفي classpath بتاعهم هنا
        // مثال: classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // لو كان عندك repositories إضافية (مثل jitpack أو maven { url '...' })
        // ضيفيها هنا
    }
}

// هذا الجزء مهم جدًا في مشاريع Flutter
rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// مهم: تنظيف المشروع عند تشغيل ./gradlew clean
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}